<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>🏉 ラグビー作戦ボード NEW</title><style>
*{box-sizing:border-box}body{margin:0;background:#10271f;color:#fff;font-family:system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:10px}.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}button,select,input{font:inherit;border:0;border-radius:8px;padding:9px 11px;background:#f4f5f6;color:#14251e;font-weight:700}button{cursor:pointer}button.primary{background:#f4c65b}button.active{background:#77d8b3}button:disabled{opacity:.45;cursor:default}input[type=color]{width:42px;height:39px;padding:3px}#notice{font-size:13px;min-height:22px}.board{position:relative;width:100%;height:min(65dvh,650px);min-height:260px;border:2px solid #d7e7d8;border-radius:10px;background:repeating-linear-gradient(90deg,#28794e 0%,#28794e 10%,#2c8254 10%,#2c8254 20%);touch-action:none;overflow:hidden;user-select:none}.line{position:absolute;top:0;bottom:0;border-left:1px solid #ffffff88;pointer-events:none}.line.mid{border-left:2px solid #fff}.magnet{position:absolute;transform:translate(-50%,-50%);width:clamp(22px,4.5vw,32px);height:clamp(22px,4.5vw,32px);border-radius:50%;border:2px solid white;box-shadow:0 1px 4px #0008;display:grid;place-items:center;font-weight:800;font-size:12px;touch-action:none;cursor:grab;z-index:2}.blue{background:#2164e4}.red{background:#db4343}.ball{background:#f5f5e9;color:#4a2b08;width:35px;border-radius:45%;font-size:19px}.selected{outline:3px solid #ffdc4d;outline-offset:2px}#ink{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;touch-action:none}.hint,.foot{font-size:12px;opacity:.85;margin-top:8px}.tag{background:#204739;border-radius:8px;padding:5px 9px;font-size:12px}.frames{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.frame{display:flex;gap:5px;align-items:center;background:#204739;border-radius:8px;padding:5px}.frame button{padding:6px 8px;font-size:12px}h3{margin:15px 0 6px;font-size:15px}#preview{width:100%;max-width:520px;border-radius:8px;display:none;margin-top:8px}label{font-size:13px}#speed{max-width:140px}@media(max-width:550px){button,select{font-size:13px;padding:8px}.board{height:54dvh}.bar{gap:5px}}
</style></head><body><main class="app"><div class="bar"><strong>🏉 ラグビー作戦ボード NEW</strong><span class="tag">Ver.2.1 修正版</span></div><div class="bar"><button id="save" class="primary">＋ 配置を保存</button><select id="scenes" aria-label="保存した配置"><option value="">保存した配置を選択</option></select><button id="load">呼び出す</button><button id="remove">保存を削除</button><button id="reset">初期配置</button></div><div class="bar"><span class="tag">操作</span><button data-tool="move" class="active">☝️ 移動</button><button data-tool="pen">✏️ ペン</button><button data-tool="arrow">➜ 矢印</button><button data-tool="text">Ｔ 文字</button><input type="color" id="color" value="#ffdf59" title="線と文字の色"><button id="undo">↶ 1つ戻す</button><button id="clear">書き込み全消去</button></div><div id="notice" aria-live="polite">選手をドラッグ、または選手→移動先の順にタップ。描くときはツールを選んでね。</div><div class="board" id="board"><div class="line" style="left:10%"></div><div class="line" style="left:25%"></div><div class="line mid" style="left:50%"></div><div class="line" style="left:75%"></div><div class="line" style="left:90%"></div><canvas id="ink"></canvas></div><div class="hint">🔵 青15人　🔴 赤15人　🏉 ボール ｜ 書き込み・配置はまとめて保存できるよ</div><h3>📸 画像・アニメーション</h3><div class="bar"><button id="jpg" class="primary">JPEGを保存</button><button id="addframe">＋ この場面を追加</button><button id="play">▶ 場面を再生</button><button id="stop">■ 停止</button><label>速度 <select id="speed"><option value="1500">1.5秒</option><option value="2500" selected>2.5秒</option><option value="4000">4秒</option><option value="6000">6秒</option></select></label><button id="gif" class="primary">GIFを書き出す</button></div><div class="frames" id="frames"></div><img id="preview" alt="作成したGIFのプレビュー"><div class="foot">💡 例：①配置 → ②動き出し → ③展開 を追加してGIF化。LINEで画像やGIFを送れるよ。GIFは各場面を切り替えるコマ送り式。配置保存はこのブラウザ内、JPEG/GIFはファイルとして保存される。</div></main><script>
(()=>{'use strict';
const board=document.querySelector('#board'),ink=document.querySelector('#ink'),ctx=ink.getContext('2d'),notice=document.querySelector('#notice'),select=document.querySelector('#scenes');
const initial=[...Array.from({length:15},(_,i)=>({id:'b'+(i+1),team:'blue',n:i+1,x:4.3,y:5+i*6.3})),...Array.from({length:15},(_,i)=>({id:'r'+(i+1),team:'red',n:i+1,x:95.7,y:5+i*6.3})),{id:'ball',team:'ball',n:'🏉',x:50,y:50}];
const clone=o=>JSON.parse(JSON.stringify(o)),key='rugby_magnet_scenes_v1',framesKey='rugby_board_v2_frames';
let pieces=clone(initial),drawings=[],selected=null,drag=null,tool='move',draft=null,frames=[],timer=null;
let scenes=[];try{scenes=JSON.parse(localStorage.getItem(key)||'[]')}catch(_){}try{frames=JSON.parse(localStorage.getItem(framesKey)||'[]')}catch(_){}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function pos(e){const r=board.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*100/r.width,0,100),y:clamp((e.clientY-r.top)*100/r.height,0,100)}}
function render(){board.querySelectorAll('.magnet').forEach(e=>e.remove());for(const p of pieces){const el=document.createElement('div');el.className='magnet '+p.team+(selected===p.id?' selected':'');el.dataset.id=p.id;el.textContent=p.n;el.style.left=p.x+'%';el.style.top=p.y+'%';board.appendChild(el)}paint()}
function updateOne(){for(const p of pieces){const el=board.querySelector('.magnet[data-id="'+p.id+'"]');if(el){el.style.left=p.x+'%';el.style.top=p.y+'%';el.classList.toggle('selected',selected===p.id)}}}
function move(id,e){const p=pieces.find(p=>p.id===id);if(p){const q=pos(e);p.x=clamp(q.x,3,97);p.y=clamp(q.y,4,96)}updateOne()}
function setTool(t){tool=t;selected=null;drag=null;updateOne();document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));ink.style.pointerEvents=t==='move'?'none':'auto';notice.textContent={move:'マグネットを動かせるよ',pen:'指で線を描こう',arrow:'始点から終点へ指を動かして矢印を描こう',text:'文字を置く位置をタップ。入力後は移動に戻るよ'}[t]}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
board.addEventListener('pointerdown',e=>{if(tool!=='move')return;const el=e.target.closest('.magnet');if(el){selected=el.dataset.id;drag={id:selected,pid:e.pointerId,x:e.clientX,y:e.clientY,moved:false};updateOne();try{board.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()}else if(selected){move(selected,e);notice.textContent='配置を編集中。保存もできるよ';e.preventDefault()}});
board.addEventListener('pointermove',e=>{if(tool!=='move'||!drag||drag.pid!==e.pointerId)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>4)drag.moved=true;if(drag.moved)move(drag.id,e)});
board.addEventListener('pointerup',e=>{if(drag&&drag.pid===e.pointerId){if(drag.moved)move(drag.id,e);drag=null}});board.addEventListener('pointercancel',()=>drag=null);
ink.addEventListener('pointerdown',e=>{if(tool==='move')return;const p=pos(e),color=document.querySelector('#color').value;if(tool==='text'){setTool('move');const value=prompt('書き込む文字は？');if(value&&value.trim()){drawings.push({type:'text',x:p.x,y:p.y,text:value.trim().slice(0,80),color});paint();notice.textContent='文字を追加したよ。移動モードに戻したよ'}else{notice.textContent='文字入力をキャンセル。移動モードに戻したよ'}return}draft=tool==='pen'?{type:'pen',points:[p],color}:{type:'arrow',from:p,to:p,color};ink.setPointerCapture(e.pointerId);e.preventDefault()});
ink.addEventListener('pointermove',e=>{if(!draft)return;const p=pos(e);if(draft.type==='pen')draft.points.push(p);else draft.to=p;paint()});
function endDraw(){if(!draft)return;drawings.push(draft);draft=null;paint()}ink.addEventListener('pointerup',endDraw);ink.addEventListener('pointercancel',endDraw);
function drawItem(c,item,w,h){const xy=p=>({x:p.x*w/100,y:p.y*h/100});c.save();c.strokeStyle=item.color||'#ffdf59';c.fillStyle=item.color||'#ffdf59';c.lineWidth=Math.max(3,w/260);c.lineCap='round';c.lineJoin='round';if(item.type==='pen'){const pts=item.points||[];if(pts.length){c.beginPath();pts.forEach((p,i)=>{const a=xy(p);i?c.lineTo(a.x,a.y):c.moveTo(a.x,a.y)});c.stroke()}}else if(item.type==='arrow'){const a=xy(item.from),b=xy(item.to),ang=Math.atan2(b.y-a.y,b.x-a.x),len=Math.max(13,w/42);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();c.beginPath();c.moveTo(b.x,b.y);c.lineTo(b.x-len*Math.cos(ang-.5),b.y-len*Math.sin(ang-.5));c.moveTo(b.x,b.y);c.lineTo(b.x-len*Math.cos(ang+.5),b.y-len*Math.sin(ang+.5));c.stroke()}else if(item.type==='text'){const a=xy(item);c.font=`bold ${Math.max(18,w/34)}px system-ui,sans-serif`;c.textBaseline='top';c.shadowColor='#10271f';c.shadowBlur=4;String(item.text).split('\n').forEach((line,i)=>c.fillText(line,a.x,a.y+i*Math.max(24,w/28),w-a.x))}c.restore()}
function paint(){const r=board.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,r.width),h=Math.max(1,r.height);ink.width=Math.round(w*dpr);ink.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);for(const d of drawings)drawItem(ctx,d,w,h);if(draft)drawItem(ctx,draft,w,h)}new ResizeObserver(paint).observe(board);
function refresh(){select.innerHTML='<option value="">保存した配置を選択</option>';scenes.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;select.appendChild(o)})}
function persist(){try{localStorage.setItem(key,JSON.stringify(scenes));return true}catch(_){notice.textContent='ブラウザの保存容量が不足しているよ';return false}}
document.querySelector('#save').onclick=()=>{const name=prompt('配置の名前は？','配置 '+(scenes.length+1));if(name===null)return;scenes.push({name:name.trim()||'配置 '+(scenes.length+1),pieces:clone(pieces),drawings:clone(drawings)});persist();refresh();select.value=String(scenes.length-1);notice.textContent='配置と書き込みを保存したよ！'};
document.querySelector('#load').onclick=()=>{const s=scenes[Number(select.value)];if(select.value===''||!s){notice.textContent='保存した配置を選んでね';return}pieces=clone(s.pieces);drawings=clone(s.drawings||[]);selected=null;render();notice.textContent='「'+s.name+'」を呼び出したよ'};
document.querySelector('#remove').onclick=()=>{if(select.value==='')return;scenes.splice(Number(select.value),1);persist();refresh();notice.textContent='保存した配置を削除したよ'};
document.querySelector('#reset').onclick=()=>{pieces=clone(initial);drawings=[];selected=null;render();notice.textContent='初期配置に戻したよ'};
document.querySelector('#undo').onclick=()=>{setTool('move');if(drawings.length){drawings.pop();paint();notice.textContent='最後の書き込みを取り消したよ'}else notice.textContent='戻せる書き込みがないよ'};document.querySelector('#clear').onclick=()=>{setTool('move');if(!drawings.length){notice.textContent='消す書き込みはないよ';return}if(confirm('書き込みをすべて消す？')){drawings=[];paint();notice.textContent='書き込みをすべて消したよ。移動モードに戻したよ'}};
function snapshot(){return{pieces:clone(pieces),drawings:clone(drawings)}}
function makeCanvas(state,width=800){const h=Math.round(width*board.clientHeight/board.clientWidth),c=document.createElement('canvas');c.width=width;c.height=h;const g=c.getContext('2d');g.fillStyle='#28794e';g.fillRect(0,0,width,h);g.fillStyle='#2c8254';for(let x=width*.1;x<width;x+=width*.2)g.fillRect(x,0,width*.1,h);for(const [pct,mid] of [[10,false],[25,false],[50,true],[75,false],[90,false]]){g.strokeStyle=mid?'#ffffff':'#ffffff88';g.lineWidth=mid?2:1;g.beginPath();g.moveTo(width*pct/100,0);g.lineTo(width*pct/100,h);g.stroke()}const radius=Math.max(12,Math.min(18,width*.021));for(const p of state.pieces){const x=p.x*width/100,y=p.y*h/100;g.beginPath();g.ellipse(x,y,p.team==='ball'?radius*1.15:radius,p.team==='ball'?radius*.85:radius,0,0,Math.PI*2);g.fillStyle=p.team==='blue'?'#2164e4':p.team==='red'?'#db4343':'#f5f5e9';g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();g.fillStyle=p.team==='ball'?'#4a2b08':'#fff';g.font=`bold ${p.team==='ball'?radius*1.2:radius*.95}px system-ui,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(p.n,x,y+1)}for(const d of state.drawings)drawItem(g,d,width,h);return c}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
document.querySelector('#jpg').onclick=()=>makeCanvas(snapshot()).toBlob(b=>{if(b)download(b,'rugby-board-'+Date.now()+'.jpg')},'image/jpeg',.94);
function saveFrames(){try{localStorage.setItem(framesKey,JSON.stringify(frames))}catch(_){notice.textContent='場面の保存容量を超えたよ。古い場面を削除してね'}}
function refreshFrames(){const el=document.querySelector('#frames');el.innerHTML='';frames.forEach((f,i)=>{const wrap=document.createElement('div');wrap.className='frame';const label=document.createElement('span');label.textContent=(i+1)+'. '+f.name;wrap.append(label);const load=document.createElement('button');load.textContent='表示';load.onclick=()=>showFrame(i);const del=document.createElement('button');del.textContent='×';del.title='この場面を削除';del.onclick=()=>{frames.splice(i,1);saveFrames();refreshFrames()};wrap.append(load,del);el.append(wrap)})}
function showFrame(i){const f=frames[i];if(!f)return;pieces=clone(f.state.pieces);drawings=clone(f.state.drawings);selected=null;render();notice.textContent=(i+1)+' / '+frames.length+'：'+f.name}
document.querySelector('#addframe').onclick=()=>{const name=prompt('場面の名前は？','場面 '+(frames.length+1));if(name===null)return;frames.push({name:name.trim()||'場面 '+(frames.length+1),state:snapshot()});saveFrames();refreshFrames();notice.textContent='場面 '+frames.length+' を追加したよ'};
function stop(){if(timer){clearInterval(timer);timer=null}}document.querySelector('#stop').onclick=()=>{stop();notice.textContent='再生を停止したよ'};
document.querySelector('#play').onclick=()=>{if(!frames.length){notice.textContent='先に場面を追加してね';return}stop();let i=0;showFrame(i);timer=setInterval(()=>{i=(i+1)%frames.length;showFrame(i)},Number(document.querySelector('#speed').value))};document.querySelector('#speed').onchange=()=>{if(timer)document.querySelector('#play').click()};
// 完全オフラインで動く256色GIFエンコーダ。RGB332固定パレット＋LZW圧縮。
function encodeGIF(canvases,delay){const bytes=[];const u16=n=>bytes.push(n&255,(n>>8)&255);const str=s=>{for(let i=0;i<s.length;i++)bytes.push(s.charCodeAt(i))};const w=canvases[0].width,h=canvases[0].height;str('GIF89a');u16(w);u16(h);bytes.push(0xf7,0,0);for(let i=0;i<256;i++)bytes.push(Math.round(((i>>5)&7)*255/7),Math.round(((i>>2)&7)*255/7),Math.round((i&3)*255/3));bytes.push(0x21,0xff,11);str('NETSCAPE2.0');bytes.push(3,1,0,0,0);
for(const canvas of canvases){bytes.push(0x21,0xf9,4,0x04);u16(Math.max(2,Math.round(delay/10)));bytes.push(0,0);bytes.push(0x2c);u16(0);u16(0);u16(w);u16(h);bytes.push(0);bytes.push(8);const data=canvas.getContext('2d').getImageData(0,0,w,h).data;const pixels=new Uint8Array(w*h);for(let i=0,j=0;i<data.length;i+=4,j++)pixels[j]=(data[i]&224)|((data[i+1]&224)>>3)|(data[i+2]>>6);
// 互換性優先：LZW辞書を定期リセットして9bit固定で符号化する。
// 圧縮率より、Android/LINEで開ける正しいGIFを優先。
const out=[];let bitBuf=0,bitCount=0;
const write=code=>{bitBuf|=code<<bitCount;bitCount+=9;while(bitCount>=8){out.push(bitBuf&255);bitBuf>>>=8;bitCount-=8}};
write(256);let count=0;
for(const pixel of pixels){if(count===200){write(256);count=0}write(pixel);count++}
write(257);if(bitCount)out.push(bitBuf&255);
for(let i=0;i<out.length;i+=255){const block=out.slice(i,i+255);bytes.push(block.length,...block)}bytes.push(0)}bytes.push(0x3b);return new Blob([new Uint8Array(bytes)],{type:'image/gif'})}
document.querySelector('#gif').onclick=async()=>{if(!frames.length){notice.textContent='先に場面を追加してね';return}stop();const btn=document.querySelector('#gif');btn.disabled=true;notice.textContent='GIFを作成中…';try{await new Promise(r=>setTimeout(r,30));const canvases=frames.map(f=>makeCanvas(f.state,480)),blob=encodeGIF(canvases,Number(document.querySelector('#speed').value));const preview=document.querySelector('#preview');if(preview.dataset.url)URL.revokeObjectURL(preview.dataset.url);preview.dataset.url=URL.createObjectURL(blob);preview.src=preview.dataset.url;preview.style.display='block';download(blob,'rugby-board-'+Date.now()+'.gif');notice.textContent='GIF完成！ '+frames.length+'場面を保存したよ'}catch(e){notice.textContent='GIF作成に失敗：'+e.message}finally{btn.disabled=false}};
refresh();refreshFrames();render();setTool('move');
})();
</script></body></html>
