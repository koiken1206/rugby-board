<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ラグビー マグネット戦術ボード</title><style>*{box-sizing:border-box}body{margin:0;background:#10271f;color:#fff;font-family:system-ui,sans-serif}.app{max-width:1000px;margin:auto;padding:8px}.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}button,select{font:inherit;border:0;border-radius:8px;padding:9px 11px;background:#f4f5f6;color:#14251e;font-weight:700}button.primary{background:#f4c65b}#notice{font-size:12px;opacity:.9}.board{position:relative;width:100%;height:min(72dvh,650px);min-height:250px;border:2px solid #d7e7d8;border-radius:10px;background:repeating-linear-gradient(90deg,#28794e 0%,#28794e 10%,#2c8254 10%,#2c8254 20%);touch-action:none;overflow:hidden;user-select:none}.line{position:absolute;top:0;bottom:0;border-left:1px solid #ffffff88;pointer-events:none}.line.mid{border-left:2px solid #fff}.magnet{position:absolute;transform:translate(-50%,-50%);width:clamp(22px,4.5vw,32px);height:clamp(22px,4.5vw,32px);border-radius:50%;border:2px solid white;box-shadow:0 1px 4px #0008;display:grid;place-items:center;font-weight:800;font-size:12px;touch-action:none;cursor:grab}.blue{background:#2164e4}.red{background:#db4343}.ball{background:#f5f5e9;color:#4a2b08;width:35px;border-radius:45%;font-size:19px}.selected{outline:3px solid #ffdc4d;outline-offset:2px}.hint{font-size:12px;opacity:.82;margin-top:8px}.foot{font-size:12px;opacity:.75;margin-top:7px}</style></head><body><main class="app"><div class="bar"><strong>🏉 マグネット戦術ボード</strong><button id="save" class="primary">＋ 配置を保存</button><select id="scenes" aria-label="保存した配置"><option value="">保存した配置を選択</option></select><button id="load">配置を呼び出す</button><button id="remove">保存を削除</button><button id="reset">初期配置</button></div><div id="notice" aria-live="polite">選手をドラッグ、または選手→移動先の順にタップ</div><div class="board" id="board"><div class="line" style="left:10%"></div><div class="line" style="left:25%"></div><div class="line mid" style="left:50%"></div><div class="line" style="left:75%"></div><div class="line" style="left:90%"></div></div><div class="hint">🔵 青15人　🔴 赤15人　🏉 ボール　｜　保存した配置はこのブラウザ内に保持されるよ</div><div class="foot">画面録画はPixel Foldの標準機能で開始して、配置を呼び出してから手で動かしながら説明してね。</div></main><script>(()=>{const board=document.querySelector('#board'),notice=document.querySelector('#notice'),select=document.querySelector('#scenes');const initial=[...Array.from({length:15},(_,i)=>({id:'b'+(i+1),team:'blue',n:i+1,x:4.3,y:5+i*6.3})),...Array.from({length:15},(_,i)=>({id:'r'+(i+1),team:'red',n:i+1,x:95.7,y:5+i*6.3})),{id:'ball',team:'ball',n:'🏉',x:50,y:50}];let pieces=structuredClone(initial),selected=null,drag=null;const key='rugby_magnet_scenes_v1';let scenes=[];try{scenes=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function pos(e){const r=board.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*100/r.width,3,97),y:clamp((e.clientY-r.top)*100/r.height,4,96)}}function render(){board.querySelectorAll('.magnet').forEach(e=>e.remove());for(const p of pieces){const el=document.createElement('div');el.className='magnet '+p.team+(selected===p.id?' selected':'');el.dataset.id=p.id;el.textContent=p.n;el.style.left=p.x+'%';el.style.top=p.y+'%';board.appendChild(el)}}function updateOne(){for(const p of pieces){const el=board.querySelector('.magnet[data-id="'+p.id+'"]');if(el){el.style.left=p.x+'%';el.style.top=p.y+'%';el.classList.toggle('selected',selected===p.id)}}}function move(id,e){const p=pieces.find(p=>p.id===id);if(p)Object.assign(p,pos(e));updateOne()}board.addEventListener('pointerdown',e=>{const el=e.target.closest('.magnet');if(el){selected=el.dataset.id;drag={id:selected,pid:e.pointerId,x:e.clientX,y:e.clientY,moved:false};updateOne();try{board.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()}else if(selected){move(selected,e);notice.textContent='配置を編集中。気に入ったら「＋ 配置を保存」';e.preventDefault()}});board.addEventListener('pointermove',e=>{if(!drag||drag.pid!==e.pointerId)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>4)drag.moved=true;if(drag.moved)move(drag.id,e)});board.addEventListener('pointerup',e=>{if(drag&&drag.pid===e.pointerId){if(drag.moved)move(drag.id,e);drag=null}});board.addEventListener('pointercancel',()=>drag=null);function refresh(){select.innerHTML='<option value="">保存した配置を選択</option>';scenes.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;select.appendChild(o)})}document.querySelector('#save').onclick=()=>{const name=prompt('配置の名前は？','配置 '+(scenes.length+1));if(name===null)return;scenes.push({name:name.trim()||'配置 '+(scenes.length+1),pieces:structuredClone(pieces)});try{localStorage.setItem(key,JSON.stringify(scenes))}catch(e){notice.textContent='このブラウザでは保存できなかった'}refresh();select.value=String(scenes.length-1);notice.textContent='配置を保存したよ！'};document.querySelector('#load').onclick=()=>{const s=scenes[Number(select.value)];if(select.value===''||!s){notice.textContent='保存した配置を選んでね';return}pieces=structuredClone(s.pieces);selected=null;render();notice.textContent='「'+s.name+'」を呼び出したよ。ここから自由に動かせる！'};document.querySelector('#remove').onclick=()=>{if(select.value==='')return;scenes.splice(Number(select.value),1);localStorage.setItem(key,JSON.stringify(scenes));refresh();notice.textContent='保存した配置を削除したよ'};document.querySelector('#reset').onclick=()=>{pieces=structuredClone(initial);selected=null;render();notice.textContent='初期配置に戻したよ'};refresh();render()})();</script></body></html>
